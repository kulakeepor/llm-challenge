<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>挑战大模型工程师</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* VOICE  考场 / 竞赛：冷静、精确、像一场正式比赛
   IDEA   竞赛详情页：总览是关卡列表，每关一个详情页（标签 · 等宽大标题 · 深色考核面板 · 统计卡 · 标签页）
   PICTURE 深色考核面板 + 通关后的红色印章
   COLOUR zinc 灰阶，绿色=可挑战/通过，橙色=进行中，红色=印章（参考 Deep-ML 的配色与字体，按 Blue 要求）
   TYPE   标题 JetBrains Mono 粗体，正文 Inter；中文回落到系统黑体 */
:root{
  color-scheme:light;
  --bg:#fafafa; --card:#ffffff; --card2:#f4f4f5; --line:#e4e4e7; --line2:#d4d4d8;
  --ink:#09090b; --muted:#52525b; --dim:#71717a;
  --chip:#f4f4f5; --chip-ink:#3f3f46;
  --green:#22c55e; --green-ink:#15803d; --green-soft:#dcfce7;
  --orange-ink:#c2410c; --orange-soft:#ffedd5;
  --red:#dc2626; --red-soft:#fee2e2; --link:#2563eb;
  --btn:#18181b; --btn-ink:#fafafa;
  --f-body:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,"PingFang SC","Microsoft YaHei",monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;--bg:#09090b;--card:#111113;--card2:#18181b;--line:#27272a;--line2:#3f3f46;
  --ink:#fafafa;--muted:#a1a1aa;--dim:#71717a;--chip:#27272a;--chip-ink:#d4d4d8;
  --green-ink:#4ade80;--green-soft:rgba(34,197,94,.14);--orange-ink:#fb923c;--orange-soft:rgba(124,45,18,.3);
  --red:#ef4444;--red-soft:rgba(127,29,29,.35);--link:#60a5fa;--btn:#f4f4f5;--btn-ink:#18181b}}
:root[data-theme=dark]{
  color-scheme:dark;--bg:#09090b;--card:#111113;--card2:#18181b;--line:#27272a;--line2:#3f3f46;
  --ink:#fafafa;--muted:#a1a1aa;--dim:#71717a;--chip:#27272a;--chip-ink:#d4d4d8;
  --green-ink:#4ade80;--green-soft:rgba(34,197,94,.14);--orange-ink:#fb923c;--orange-soft:rgba(124,45,18,.3);
  --red:#ef4444;--red-soft:rgba(127,29,29,.35);--link:#60a5fa;--btn:#f4f4f5;--btn-ink:#18181b}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);overflow-x:clip;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding-block:24px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3,h4{font-family:var(--f-mono);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(30px,5.4vw,52px);font-weight:700;letter-spacing:-.03em}
h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
h3{font-size:17px;font-weight:700}
h4{font-size:14px;font-weight:700}
p{margin:0}
a{color:var(--link)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted)}
.lede{color:var(--muted);font-size:16px;max-width:70ch;margin-top:10px}
button,.btn{font:500 14px/1.2 var(--f-mono);border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--ink);padding:10px 14px;min-height:40px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover:not(:disabled),.btn:hover{border-color:var(--ink)}
button.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
button.primary:hover:not(:disabled){opacity:.9}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
textarea,input[type=text],input[type=url]{width:100%;font:16px/1.5 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:10px 12px}
textarea{resize:vertical;min-height:120px}
textarea.code{font:13px/1.5 var(--f-mono);min-height:140px}
input[type=file]{font-size:13px;color:var(--muted);max-width:100%}

/* 标签 */
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font:500 12px/1 var(--f-body);text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--chip);color:var(--chip-ink);white-space:nowrap}
.tag.passed{background:var(--green);color:#000}
.tag.open{background:transparent;color:var(--green-ink);box-shadow:inset 0 0 0 1px var(--green)}
.tag.half{background:var(--orange-soft);color:var(--orange-ink)}
.tag.locked{background:var(--chip);color:var(--dim)}
.back{font:500 13px var(--f-mono);color:var(--muted);text-decoration:none;align-self:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.back:hover{color:var(--ink);border-color:var(--line2)}

/* 总览头部 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.score{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.score .big{font:700 44px/1 var(--f-mono)}
.score .big small{font-size:18px;color:var(--dim)}
.bar{display:flex;gap:4px}
.bar i{width:24px;height:6px;border-radius:2px;background:var(--line2)}
.bar i.on{background:var(--red)}
@media (max-width:620px){.hero{grid-template-columns:1fr}.score{align-items:flex-start}}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:36px;padding:8px 12px}
.seg button[aria-pressed=true]{background:var(--btn);color:var(--btn-ink)}
.notice{font-size:13.5px;border-radius:10px;padding:10px 14px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.notice.warn{background:var(--orange-soft);color:var(--orange-ink);border-color:transparent}

/* 关卡卡片 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.lvl{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;min-height:180px;transition:border-color .15s}
.lvl:hover{border-color:var(--line2)}
.lvl.locked{border:2px dashed var(--line2);background:transparent}
.lvl.half{border-color:var(--orange-ink)}
.lvl .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lvl .code{font:500 13px var(--f-mono);color:var(--dim)}
.lvl h3{font-size:19px}
.lvl.locked h3{color:var(--muted)}
.lvl .meta{font-size:13px;color:var(--muted);margin-top:auto;display:flex;flex-wrap:wrap;gap:4px 14px}
.ev{display:flex;gap:4px}
.ev i{width:18px;height:4px;border-radius:2px;background:var(--line2)}
.ev i.on{background:var(--green)}
.pf-entry{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--card)}

/* 印章 */
.seal{position:absolute;right:16px;bottom:14px;width:74px;height:74px;border:3px solid var(--red);border-radius:10px;color:var(--red);display:grid;place-items:center;transform:rotate(-12deg);font:700 19px/1.05 var(--f-mono);text-align:center;opacity:.9;pointer-events:none;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--red)}
.seal small{display:block;font-size:9.5px;font-weight:500;margin-top:4px}
.seal.big{position:static;width:96px;height:96px;font-size:24px;flex:none;box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 4px var(--red)}
@media (prefers-reduced-motion:no-preference){.seal{animation:stamp .35s ease-out}@keyframes stamp{from{transform:rotate(-12deg) scale(1.6);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.9}}}
.title-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.lvl.passed .meta{padding-right:84px}
@media (max-width:620px){.seal.big{width:72px;height:72px;font-size:18px}}

/* 考核面板（始终深色） */
.panel{--ink:#fafafa;--muted:#a1a1aa;--dim:#a1a1aa;--line:#27272a;--line2:#3f3f46;--btn:#f4f4f5;--btn-ink:#18181b;--link:#93c5fd;--bg:#09090b;
  background:#18181b;color:var(--ink);border:1px solid #27272a;border-radius:14px;padding:clamp(16px,2.4vw,24px);display:flex;flex-direction:column;gap:18px;color-scheme:dark}
.panel .ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.panel .eyebrow{font:400 12px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:#d4d4d8}
.panel .pname{font:700 16px var(--f-mono);margin-top:6px;color:#fafafa}
.pchips{display:flex;gap:8px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.pchips li{font:500 12px var(--f-mono);color:#e4e4e7;border:1px solid #3f3f46;border-radius:999px;padding:6px 10px;white-space:nowrap}
.pchips .seg{border-color:#3f3f46;border-radius:999px}
.pchips .seg button{min-height:28px;padding:4px 10px;font-size:12px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:760px){.pgrid{grid-template-columns:1fr}}
.pleft{display:flex;flex-direction:column;gap:12px}
.pleft p{color:#a1a1aa;font-size:14px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:r}
.rules li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:13.5px;color:#d4d4d8;counter-increment:r}
.rules li::before{content:counter(r);font:400 12px/1.9 var(--f-mono);color:#a1a1aa}
.code-chip{font:700 18px var(--f-mono);letter-spacing:.12em;border:1px dashed #4ade80;color:#4ade80;border-radius:8px;padding:6px 12px}
.cmd{font:13px/1.5 var(--f-mono);background:#09090b;border:1px solid #27272a;border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:nowrap;flex:1 1 220px;color:#e4e4e7}

/* 统计卡 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .l{font-size:13px;font-weight:500;color:var(--muted)}
.stat .v{font:700 20px/1.25 var(--f-mono);overflow-wrap:anywhere}
.stat .s{font-size:12.5px;color:var(--dim)}

/* 标签页 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;border-radius:0;background:none;color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;font-size:13.5px;min-height:44px;flex:none}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.main{display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{border-left:3px solid var(--ink);padding-left:10px;font-size:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.box ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.hidden-box{border:2px dashed var(--line2);border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card)}
.hidden-box .ic{width:44px;height:44px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:20px}
pre{margin:0;font:13px/1.55 var(--f-mono);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;color:var(--ink)}
code{font-family:var(--f-mono);font-size:.92em;background:var(--chip);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre code{background:none;padding:0}
.aside{display:flex;flex-direction:column;gap:14px}
.aside .box{gap:0;padding:16px 18px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:13.5px;margin-top:10px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;text-align:right;font-weight:500}
.checks{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}

/* 提交 */
.pn{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.pn h4{display:flex;justify-content:space-between;gap:8px;align-items:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12.5px}
td.v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pass{color:var(--green-ink);font-weight:700}
.fail{color:var(--red);font-weight:700}
.verdict{font-weight:600;border-radius:8px;padding:10px 12px;font-size:14px}
.verdict.ok{background:var(--green-soft);color:var(--green-ink)}
.verdict.no{background:var(--red-soft);color:var(--red)}
.verdict.demo{background:var(--orange-soft);color:var(--orange-ink)}
.reasons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.reasons li{color:var(--red)}
.reasons li.note{color:var(--muted)}
.fb{font-size:14px;display:flex;flex-direction:column;gap:6px}
.fb ul{margin:0;padding-left:1.2em}
.err{color:var(--red);font-size:13.5px}
.qa{display:flex;flex-direction:column;gap:16px}
.qa .q{font-weight:500}
.qa .q .from{font-size:12px;color:var(--dim);margin-left:6px}

/* 作品集 */
.pf{display:flex;flex-direction:column;gap:14px}
.pf-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.pf-card .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.pf-card .excerpt{font-size:13.5px;border-left:3px solid var(--line2);padding-left:12px;color:var(--muted);white-space:pre-wrap}
.empty{border:2px dashed var(--line2);border-radius:14px;padding:22px;color:var(--muted)}
.foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="wrap" style="padding-top:0"><div class="notice" id="modeNote">你的进度只保存在这台设备的浏览器里。换设备或清理浏览器数据之前，请先导出备份。</div></div>
<input id="importFile" type="file" accept=".json,application/json" hidden>
<script>
{
"use strict";

const REPO = "https://github.com/kulakeepor/llm-graduation-exam";
const REPO_READY = false; // 任务包仓库发布后改成 true
const colab = nb => "https://colab.research.google.com/github/kulakeepor/llm-graduation-exam/blob/main/notebooks/" + nb;
const PROFILES = { t4: "Colab T4", mac: "我的 Mac" };
const PROFILES_LONG = { t4: "Colab 免费 T4", mac: "自己的 Mac（Apple Silicon）" };

/* ---------- 考核定义（沿用 v2） ---------- */
function b(v) { return v === true ? "通过" : v === false ? "未通过" : String(v); }
const budgetMetric = { k: "train_minutes", label: "训练耗时", needF: (s, p) => "≤ " + s.budget[p] + " 分钟（暂定）", okF: (v, s, p) => v <= s.budget[p], fmt: v => Math.round(v) + " 分钟", budget: true };
const STAGES = [
  { id: "s1", no: "一", key: "造", title: "从零手写 mini-GPT", world: "8", nb: "s1_mini_gpt.ipynb", diff: "进阶", judge: "1.1",
    budget: { t4: 120, mac: 240 }, best: { k: "val_bpc", dir: -1 },
    lede: "不用任何现成模型类，只用 PyTorch 张量，训练一个 500 万到 5000 万参数的中文模型。",
    summary: "不用任何现成模型类，只用 PyTorch 张量写出分词器、Transformer 和训练循环，训练一个 500 万到 5000 万参数的中文模型。",
    reqs: ["自己的 BPE 分词器、多头因果注意力、位置编码、LayerNorm、残差、训练循环", "支持 KV Cache 的生成函数", "训练日志记录验证集每字比特数（bpc）和训练耗时"],
    metrics: [
      { k: "params", label: "参数量", need: "500 万 – 5000 万", ok: v => v >= 5e6 && v <= 5e7, fmt: v => (v / 1e6).toFixed(1) + "M" },
      { k: "shape_ok", bool: true, label: "形状测试", need: "通过", ok: v => v === true, fmt: b },
      { k: "causal_max_diff", label: "因果性：改动未来的字后，当前输出的最大变化", need: "< 1e-5", ok: v => v < 1e-5, fmt: v => Number(v).toExponential(1) },
      { k: "kv_cache_match", bool: true, label: "带 / 不带 KV Cache 生成一致", need: "一致", ok: v => v === true, fmt: b },
      { k: "val_bpc", label: "验证集每字比特数（bpc）", need: "≤ 7.0（暂定）", ok: v => v <= 7.0, fmt: v => Number(v).toFixed(2) },
      budgetMetric,
    ],
    text: { label: "交付说明", placeholder: "贴 3 段生成样例；描述训练 / 验证 loss 曲线的走势（何时开始过拟合、你怎么处理的）；模型配置（层数、头数、维度、上下文长度、词表大小）。",
      rubric: "生成样例是否真实具体；对 loss 曲线的描述是否和数据吻合，能否指出过拟合迹象及应对；配置说明是否完整且前后一致。" },
    sample: { params: 12400000, shape_ok: true, causal_max_diff: 0, kv_cache_match: true, val_bpc: 6.41, train_minutes: 95 } },
  { id: "s2", no: "二", key: "调", title: "拆弹：修好下了毒的训练代码", world: "9", nb: null, diff: "进阶",
    budget: { t4: 60, mac: 120 }, best: { k: "loss_ratio", dir: -1 },
    lede: "一份能跑但结果是错的训练代码，藏了 5 个 Bug。只能靠诊断手段把它们找出来。",
    summary: "拿到一份能跑但结果是错的训练代码，里面藏了 5 个 Bug。只能靠 loss 曲线、梯度范数、单 batch 过拟合测试等诊断手段把它们找出来。",
    reqs: ["5 个 Bug 全部修复（裁判用隐藏测试逐个验证）", "修复后训练，验证 loss 回到参考水平", "每个 Bug 一份病历：症状 → 定位过程 → 根因 → 修复"],
    metrics: [
      { k: "bugs_fixed", label: "修好的 Bug", need: "5 / 5", ok: v => v >= 5, fmt: v => v + " / 5" },
      { k: "loss_ratio", label: "修复后验证 loss ÷ 参考 loss", need: "≤ 1.05", ok: v => v <= 1.05, fmt: v => Number(v).toFixed(3) },
      budgetMetric,

    why ? el("p", { class: "small", text: why }) : el("div", { class: "row" },
      el("button", { class: "primary", type: "button", text: L.busy ? "批改中…" : open ? "提交批改" : "试玩批改", disabled: !!L.busy, onclick: async () => {

/* ---------- 答辩（沿用 v2） ---------- */
function defensePanel(open) {
  const x = S.stages.def || {}, L = local.def || {};
  const p = el("div", { class: "pn" }, el("h4", {}, el("span", { text: "答辩" }), x.defense ? el("span", { class: x.defense.pass ? "pass" : "fail", text: "平均 " + x.defense.avg + " 分" }) : null));
  if (!open) { p.append(el("p", { class: "small", text: "前五个阶段全部通关后开放。题目来自你自己交的材料。" })); return p; }
  const why = aiUnavailable();

  const qs = x.questions;
  if (!qs) {
    p.append(el("p", { class: "small", text: "点开始后，考官读你五个阶段的书面材料并出题。" }),
      el("div", { class: "row" }, el("button", { class: "primary", type: "button", text: L.busy ? "考官出题中…" : "开始答辩", disabled: !!L.busy, onclick: async () => {
        local.def = { busy: true }; render();
        const mats = STAGES.map(s2 => "【" + s2.key + "】" + (S.stages[s2.id]?.aiText || "").slice(0, 2500)).join("\n\n");
        try {
          const q = await sample.json(`你是大模型工程师毕业答辩的考官。下面是学员五个阶段提交的材料。出 4 道答辩题：至少 2 道针对学员自己材料里的具体做法或数字追问"为什么"，其余考核心原理（如注意力缩放、loss 变 NaN 的排查顺序、LoRA 的原理与 rank 取舍）。题目要能用几段话回答。
只回复 JSON 数组，每项 {"q": "题目", "from": "出处，如 阶段三 或 原理"}。

${mats}`, { modelTier: "default" });
          const list = (Array.isArray(q) ? q : []).slice(0, 4).map(o => ({ q: String(o?.q || ""), from: String(o?.from || "") })).filter(o => o.q);
          if (list.length !== 4) throw { code: "题目数量不对" };
          local.def = {}; Object.assign(st("def"), { questions: list, defense: null }); recompute("def"); persist(); render();
        } catch (err) { local.def = { err: aiErr(err) }; render(); }
      } })), L.err ? el("p", { class: "err", text: L.err }) : null);
    return p;
  }
  p.append(el("div", { class: "qa" }, qs.map((o, i) => el("div", {}, el("p", { class: "q" }, (i + 1) + ". " + o.q, el("span", { class: "from", text: o.from })),
    el("textarea", { id: "ans-" + i, placeholder: "用你自己的话回答", "aria-label": "第 " + (i + 1) + " 题回答" })))));
  const d = x.defense;
  p.append(el("div", { class: "row" },
    el("button", { class: "primary", type: "button", text: L.busy ? "评分中…" : "交卷", disabled: !!L.busy, onclick: async () => {
      const answers = qs.map((_, i) => ($("#ans-" + i)?.value || "").trim());

      local.def = { busy: true }; render();
      try {
        const r = await sample.json(`你是大模型工程师毕业答辩考官。逐题给学员的回答打分（0-100），标准：原理是否正确、是否用自己的话讲清楚、是否结合了具体例子或数据。背诵式空话不超过 50 分。
只回复 JSON 数组，每项 {"score": 整数, "comment": "一两句点评，指出对的和缺的"}，顺序与题目一致。

${qs.map((o, i) => "题目 " + (i + 1) + "：" + o.q + "\n回答：" + answers[i].slice(0, 3000)).join("\n\n")}`, { modelTier: "default" });
        const items = qs.map((_, i) => ({ score: Math.max(0, Math.min(100, Math.round(Number(r?.[i]?.score) || 0))), comment: String(r?.[i]?.comment || "") }));
        const avg = Math.round(items.reduce((a, o) => a + o.score, 0) / items.length);

        local.def = {}; st("def").defense = res; addHist("def", { type: "defense", pass: res.pass, score: avg }); recompute("def"); persist(); render();

/* ---------- 作品集 ---------- */

    const x = S.stages[s.id];
    return { id: s.id, no: s.no, key: s.key, title: s.title, date: x.passedAt, repo: x.repo || "", hash: x.auto?.codeHash || "", device: x.auto?.device || "",
      metrics: (x.auto?.rows || []).filter(r => r.label !== "挑战码").map(r => r.label + "：" + r.shown),

      excerpt: s.id === "def" ? "" : (x.aiText || "").slice(0, 300) };

    el("div", { class: "toolbar" }, el("div", { class: "row", style: "flex:1" }, name), el("button", { class: "primary", type: "button", id: "btnPortfolio", text: "导出作品集网页", onclick: e => { S.name = name.value.trim().slice(0, 40); persist(); saveFile("llm-portfolio.html", portfolioHtml(), e.currentTarget); } })),
    list, footer()];

function portfolioHtml() {

<p class="m">${it.score != null ? "评分 " + esc(it.score) + " · " : ""}${it.device ? "设备 " + esc(it.device) + " · " : ""}${it.hash ? "代码指纹 <code>" + esc(it.hash) + "</code>" : ""}</p>

<style>:root{color-scheme:light dark}body{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;color:#09090b;background:#fafafa;line-height:1.7}

/* ---------- 备份 ---------- */
async function saveFile(filename, data, btn) {
  if (!downloads) { btn.textContent = capsReady ? "这个视图不能保存文件" : "正在连接，稍后再试"; return; }
  try { await downloads.save({ filename, data }); } catch (e) { if (e?.code !== "declined") btn.textContent = "保存没有完成"; }
}
$("#importFile").addEventListener("change", async e => {
  const f = e.target.files?.[0]; if (!f) return;
  try { const x = JSON.parse(await f.text()); const from = x?.v || 2; S = migrate(x); persist(); render(); note("备份已导入" + (from < 3 ? "（已从 v2 格式升级）" : "") + "。", false); }
  catch { note("这个文件不是毕业考核的备份。", true); }
  e.target.value = "";
});
function note(t, warn) { const n = $("#modeNote"); n.className = "notice" + (warn ? " warn" : ""); n.textContent = t; }

/* ---------- 渲染 ---------- */
const app = $("#app");
app.addEventListener("input", e => { const t = e.target; if (t.id && (t.tagName === "TEXTAREA" || t.type === "text" || t.type === "url")) drafts[t.id] = t.value; });
let lastRoute = null;
function render() {
  const r = route();
  const s = byId(r);
  document.title = s ? s.title + " · 挑战大模型工程师" : r === "portfolio" ? "我的作品集 · 挑战大模型工程师" : "挑战大模型工程师";
  app.replaceChildren(...(s ? viewStage(s) : r === "portfolio" ? viewPortfolio() : viewHome()));
  for (const [id, v] of Object.entries(drafts)) { const t = document.getElementById(id); if (t && t.type !== "file") t.value = v; }
  if (r !== lastRoute) { lastRoute = r; window.scrollTo(0, 0); }
}
window.addEventListener("hashchange", render);
render();
if (!storageOk) note("这个浏览器不允许本地存储，关闭页面后进度会丢失。请随时导出备份。", true);

(async () => {
  const use = n => (window.claude && typeof claude.use === "function") ? claude.use(n).catch(e => { if (n === "sample" && e?.code === "not_granted") sampleDenied = true; return null; }) : Promise.resolve(null);
  const [db, smp, dl, usr] = await Promise.all([use("db"), use("sample"), use("downloads"), use("user")]);
  sample = smp; downloads = dl; capsReady = true;
  let owner = false;
  try { owner = (await usr?.isOwner()) === true; } catch {}
  if (owner && db) {
    ownerDb = db;
    try {
      const snap = await db.doc("exam/state").get();
      const remote = snap.exists ? snap.data() : null;
      if (remote?.kind === "llm-grad-backup" && (remote.updatedAt || 0) > (S.updatedAt || 0)) { S = migrate(remote); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch {} }
    } catch {}
    if (storageOk) note("你是本页作者：进度同时同步到存档，换设备也能看到，Claude 也能读到。", false);
  }
  render();
})();
}
